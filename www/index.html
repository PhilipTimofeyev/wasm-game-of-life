<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Wasm Game of Life</title>
    <style>
      body {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div>
      <label for="num-ticks">Speed:</label>
      <output id="output-ticks">1</output>
    </div>
    <input type="range" id="num-ticks" name="num-ticks" value="1" min="1" max="10">
    <button id="play-pause"></button>
    <canvas id="game-of-life-canvas"></canvas>
    <div>
    <button type="button" id="reset-random">Reset Random</button>
    <button type="button" id="reset-empty">Reset Empty</button>
    </div>
    <script src="./bootstrap.js"></script>
  </body>
</html>
